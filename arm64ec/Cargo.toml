[package]
name = "armor-arm64ec"
description = "armor's engine as Wine's ARM64EC emulator for x86-64 Windows programs (ADR-0047)"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# An ARM64EC Windows DLL (arm64ec-pc-windows-msvc, linked with LLVM's
# lld-link): outside the engine's workspace, like the WoW64 backend.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
armor-cpu = { path = "../crates/armor-cpu" }
armor-guest = { path = "../crates/armor-guest" }
armor-jit = { path = "../crates/armor-jit", default-features = false }
armor-x86 = { path = "../crates/armor-x86" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
