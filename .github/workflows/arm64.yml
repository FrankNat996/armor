# armor's verification chain on GitHub's ARM64 Linux runner: a second real
# CPU for the compatibility matrix (roadmap M9, docs/testing.md). The chain
# runs in a Debian 13 container (.github/ci-chain.sh), with the same tools
# as the development machine, so that the CPU is what differs; the CPU,
# kernel and page size are printed first so every run says where it ran.
name: arm64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chain:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -a
          getconf PAGESIZE
          lscpu
          grep -m1 Features /proc/cpuinfo
          grep -m1 'CPU part' /proc/cpuinfo
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"

      - name: Chain in Debian 13
        run: |
          # Ubuntu restricts unprivileged user namespaces, which --sandbox
          # needs (docs/tech/security.md).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p results
          docker run --rm --privileged -v "$PWD:/src:ro" -v "$PWD/results:/out" \
            debian:trixie bash /src/.github/ci-chain.sh

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
